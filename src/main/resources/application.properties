spring.application.name=back-etic-system
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
spring.profiles.default=dev
app.storage.path=${APP_STORAGE_PATH:storage}
app.legacy-import.max-file-size=${LEGACY_IMPORT_MAX_FILE_SIZE:512MB}
app.legacy-import.max-records=${LEGACY_IMPORT_MAX_RECORDS:5000000}
app.legacy-import.batch-size=${LEGACY_IMPORT_BATCH_SIZE:500}
app.legacy-import.completed-retention-hours=${LEGACY_IMPORT_COMPLETED_RETENTION_HOURS:24}
app.legacy-import.failed-retention-hours=${LEGACY_IMPORT_FAILED_RETENTION_HOURS:72}
spring.servlet.multipart.max-file-size=${LEGACY_IMPORT_MAX_FILE_SIZE:512MB}
spring.servlet.multipart.max-request-size=${LEGACY_IMPORT_MAX_FILE_SIZE:512MB}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.characterEncoding=UTF-8
spring.datasource.hikari.data-source-properties.connectionCollation=utf8mb4_0900_ai_ci
app.datasource.licensing.hikari.data-source-properties.characterEncoding=UTF-8
app.datasource.licensing.hikari.data-source-properties.connectionCollation=utf8mb4_0900_ai_ci
app.datasource.licensing.driver-class-name=com.mysql.cj.jdbc.Driver
app.storage.applications-root=${APPLICATIONS_STORAGE_ROOT:storage/applications}
app.storage.applications-max-bytes=${APPLICATIONS_MAX_BYTES:104857600}
app.cors.portal-origin=${PORTAL_ORIGIN:https://apps.etic-system.online}
app.licensing.enrollment-validity-hours=${LICENSING_ENROLLMENT_VALIDITY_HOURS:72}
app.licensing.challenge-validity-minutes=${LICENSING_CHALLENGE_VALIDITY_MINUTES:5}
app.licensing.offline-validity-days=${LICENSING_OFFLINE_VALIDITY_DAYS:7}
app.licensing.signing-private-key=${LICENSING_SIGNING_PRIVATE_KEY:}
app.licensing.signing-key-id=${LICENSING_SIGNING_KEY_ID:local-development}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
